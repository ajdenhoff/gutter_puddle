<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gutter puddle \ bookshelf</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://iframe.chat/scripts/main.min.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-path">
      <a class="site-path__link" href="index.html">gutter puddle</a>
      <span class="site-path__sep">\</span>
      <span class="site-path__current">bookshelf</span>
    </h1>
    <img class="site-header__gif" src="media/header.gif" alt="">
  </header>

  <main class="site-main">
    <section class="bookshelf" aria-labelledby="bookshelf-heading">
      <h2 id="bookshelf-heading" class="bookshelf__heading">entries</h2>
      <div id="bookshelf-list" class="bookshelf__list"></div>
      <p id="bookshelf-empty" class="bookshelf__empty" hidden>No entries yet.</p>
    </section>
  </main>

  <div class="chat-widget" id="chat-widget">
    <div class="chat-widget__titlebar" id="chat-titlebar">
      <span class="chat-widget__title">gutter puddle chat</span>
      <div class="chat-widget__controls">
        <button type="button" class="chat-widget__btn" id="chat-minimize" aria-label="Minimize" title="Minimize">−</button>
        <button type="button" class="chat-widget__btn" id="chat-maximize" aria-label="Maximize" title="Maximize">□</button>
      </div>
    </div>
    <div class="chat-widget__body">
      <iframe id="chattable" src="https://iframe.chat/embed/?chat=13739958"
              width="380" height="460"></iframe>
    </div>
  </div>

  <script src="bookshelf.js"></script>
  <script src="chat-widget.js"></script>
</body>
</html>
